<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
</head>

<body onload="getdata()">
    <h1 style="text-align: center;">employee information</h1>
    <table border="1" width=100% id="emp-table">
        <tr>
            <th>emp id</th>
            <th>emp name</th>
            <th>emp job</th>
            <th>emp sal</th>
        </tr>
    </table>

    <script type="text/javascript">
        function getdata() {
            fetch('http://localhost:3000/employee')
                .then(response => response.json())
                .then((data) => {
                    console.log(data)
                    showdata(data);
                })
                .catch((error) => {
                    console.error('Error:', error)
                });
        }
        function showdata(empdata) {
            var table = document.getElementById("emp-table");

           for(let i=0;i<empdata.length;i++)
        { 
            var row = table.insertRow(1);

            
            var cell1 = row.insertCell(0);
            var cell2 = row.insertCell(1);
            var cell3 = row.insertCell(2);
            var cell4 = row.insertCell(3);
            cell1.innerHTML = empdata[i].id;
            cell2.innerHTML =  empdata[i].ename;
             cell3.innerHTML =  empdata[i].job;
            cell4.innerHTML =empdata[i].sal;
            }
        }

    </script>
</body>

</html>
