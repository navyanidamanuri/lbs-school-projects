<body>
    <h1 style="text-align: center;"> Demo Dropdown</h1>
</body>
<form name="frmname">
<p style="text-align: center;">
    <lable>Location</lable>
    <br>
    <select name="ddlloc" onchange="Dropdown()">
        <option value="-1">city</option>
        <option value="sweden">sweden</option>
        <option value="denmark">denmark</option>
        <option value="norway">norway</option>
        <option value="finland">finland</option>
    </select>
    </p>
</form>
<h2 style="text-align: center;" id="res"></h2>
<script type="text/javascript">
    function Dropdown()
    {
        let cname=frmname.ddlloc.value;
        if(cname!=="-1")
    {
        document.getElementById("res").innerHTML="your city name is:" +cname;
    }
    else
    {
        alert("pleaze enter city name");
        document.getElementById("res").innerHTML="";
    }
    }
</script>
