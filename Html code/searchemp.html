<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Information</title>
</head>

<body onload="getdata()">


<h1 style="text-align: center;">Employee Information</h1>

<div style="text-align: center; margin-bottom: 20px;">

    <input type="text" id="searchid" placeholder="Enter Employee ID">

    <input type="button" value="Search" onclick="searchemp()">

    <input type="button" value="Show All" onclick="getdata()">

</div>


<table width="100%" border="1" id="emp-table">

    <tr>
        <th>Emp ID</th>
        <th>Emp Name</th>
        <th>Emp Job</th>
        <th>Emp Salary</th>
        <th>Action</th>
    </tr>

</table>


<script>

    function getdata()
    {
        fetch('http://localhost:3000/employee')

        .then(response => response.json())

        .then(data => {

            console.log(data);

            showdata(data);

        })

        .catch(error => {

            console.error('Error:', error);

        });
    }


    function showdata(empdata)
    {
        const table = document.getElementById("emp-table");

        // Remove old rows, keep the header
        while(table.rows.length > 1)
        {
            table.deleteRow(1);
        }


        for(let i = 0; i < empdata.length; i++)
        {
            let row = table.insertRow(-1);

            let cell1 = row.insertCell(0);
            let cell2 = row.insertCell(1);
            let cell3 = row.insertCell(2);
            let cell4 = row.insertCell(3);
            let cell5 = row.insertCell(4);

            cell1.innerHTML = empdata[i].id;
            cell2.innerHTML = empdata[i].ename;
            cell3.innerHTML = empdata[i].job;
            cell4.innerHTML = empdata[i].sal;

            cell5.innerHTML =
                `<button onclick="deleteemp('${empdata[i].id}', this)">
                    Delete
                </button>`;
        }
    }


    function searchemp()
    {
        let searchid = document.getElementById("searchid").value;

        fetch('http://localhost:3000/employee')

        .then(response => response.json())

        .then(data => {

            let result = data.filter(employee =>
                String(employee.id) === String(searchid)
            );

            if(result.length === 0)
            {
                alert("Employee not found");
            }
            else
            {
                showdata(result);
            }

        })

        .catch(error => {

            console.error("Error:", error);

        });
    }


    function deleteemp(id, button)
    {
        if(confirm("Are you sure you want to delete this employee?"))
        {
            fetch(`http://localhost:3000/employee/${id}`, {
                method: 'DELETE'
            })

            .then(response => {

                if(response.ok)
                {
                    alert("Employee deleted");

                    button.parentElement.parentElement.remove();
                }
                else
                {
                    alert("Employee could not be deleted");
                }

            })

            .catch(error => {

                console.error("Error:", error);

            });
        }
    }

</script>

</body>

</html>
